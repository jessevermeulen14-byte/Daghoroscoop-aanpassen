name: AI Report - nieuwe aflevering via email

on:
  schedule:
    # Elke vijf minuten, verschoven om drukte op hele uren te vermijden.
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-report-mail.yml'
      - 'podcast-monitor/check_ai_report.py'

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-report-rss-monitor
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Controleer AI Report podcast RSS
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 podcast-monitor/check_ai_report.py
      - name: Test GitHub e-mailmelding (alleen eerste installatie of wijziging)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "${{ github.repository }}" --body "De AI Report RSS-controle is door github-actions[bot] uitgevoerd. Dit is een test van e-mailnotificaties, geen nieuwe aflevering."
