name: Build 420 unsigned APK
on:
  push:
    branches: [ apk-build-420 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
      - name: Build unsigned release APK
        run: |
          cd slimme-apk-build-406/android
          /opt/gradle-8.10.2/bin/gradle --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx512m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8' -PslimBuildNumber=420 :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Slimme-Modelkiezer-build-420-unsigned.apk"
          sha256sum "$GITHUB_WORKSPACE/Slimme-Modelkiezer-build-420-unsigned.apk"
      - name: Publish public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-420-unsigned --yes || true
          gh release create build-420-unsigned \
            Slimme-Modelkiezer-build-420-unsigned.apk \
            --title "Slimme Modelkiezer build 420 unsigned" \
            --notes "Unsigned build 420 for permanent signing."
