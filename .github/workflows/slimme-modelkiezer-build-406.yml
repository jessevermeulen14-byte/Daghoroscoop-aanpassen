name: Build Slimme Modelkiezer 406

on:
  push:
    branches:
      - apk-build-406
    paths:
      - 'slimme-apk-build-406/android/**'
      - '.github/workflows/slimme-modelkiezer-build-406.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build APK 406
        shell: bash
        run: |
          set -euxo pipefail
          cd slimme-apk-build-406/android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          gradle --no-daemon --stacktrace -PslimBuildNumber=406 :app:assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/Slimme-Modelkiezer-V2-build-406.apk
          sha256sum ../dist/Slimme-Modelkiezer-V2-build-406.apk | tee ../dist/Slimme-Modelkiezer-V2-build-406.apk.sha256

      - name: Upload APK to direct public URL
        shell: bash
        run: |
          set -euxo pipefail
          APK="slimme-apk-build-406/dist/Slimme-Modelkiezer-V2-build-406.apk"
          URL="$(curl -fsS --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -F 'reqtype=fileupload' -F "fileToUpload=@$APK" https://catbox.moe/user/api.php)"
          echo "$URL" | grep -Eq '^https://files\.catbox\.moe/[A-Za-z0-9._-]+$'
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          printf 'APK_URL=%s\nSHA256=%s\nBUILD=406\nSOURCE_COMMIT=6ebf02746d29c7935cc85a7f2afaa39cca0b6ff0\nSIGNING=github-runner-debug-clean-install-required\n' "$URL" "$SHA" > slimme-apk-build-406/APK_LATEST.txt
          cat slimme-apk-build-406/APK_LATEST.txt

      - name: Save direct link to branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "slim-apk-builder"
          git config user.email "slim-apk-builder@users.noreply.github.com"
          git add slimme-apk-build-406/APK_LATEST.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish build 406 direct APK link [skip ci]"
            git push origin HEAD:apk-build-406
          fi

      - name: Preserve APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slimme-Modelkiezer-V2-build-406
          path: slimme-apk-build-406/dist/Slimme-Modelkiezer-V2-build-406.apk
          if-no-files-found: error
