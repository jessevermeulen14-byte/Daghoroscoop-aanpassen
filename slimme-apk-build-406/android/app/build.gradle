plugins { id 'com.android.application' }
def slimBuildNumber = (project.findProperty('slimBuildNumber') ?: '1').toString().toInteger()
android { namespace 'nl.slimmemodelkiezer.android'; compileSdk 35
  buildFeatures { buildConfig true }
  defaultConfig {
    applicationId 'nl.slimmemodelkiezer.android.v2'
    minSdk 26
    targetSdk 35
    versionCode 2000 + Math.max(345, slimBuildNumber)
    versionName "0.1.30-v2-build.${Math.max(345, slimBuildNumber)}"
  }
  // An update can preserve app data only when the ORIGINAL installed APK's key is reused.
  // Codemagic must inject these variables from a securely uploaded existing keystore.
  signingConfigs {
    original {
      def env = System.getenv()
      if (env.CM_KEYSTORE_PATH && env.CM_KEYSTORE_PASSWORD && env.CM_KEY_ALIAS && env.CM_KEY_PASSWORD) {
        storeFile file(env.CM_KEYSTORE_PATH)
        storePassword env.CM_KEYSTORE_PASSWORD
        keyAlias env.CM_KEY_ALIAS
        keyPassword env.CM_KEY_PASSWORD
      }
    }
  }
  buildTypes {
    debug {
      // Debug builds normally receive a different CI-generated key on each machine.
      // Never publish an update candidate signed with an unverified ephemeral key.
      if (System.getenv('CM_KEYSTORE_PATH')) {
        signingConfig signingConfigs.original
      }
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
  implementation 'androidx.core:core:1.15.0'
  // Build 412: local, on-device OCR for ChatGPT's Compose model sheet.
  // No prompt or screenshot is sent to a server.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
  constraints {
    implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
    implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
  }
  testImplementation 'junit:junit:4.13.2'
}
