workflows:
  android-debug:
    name: Bouw gratis Android APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Debug APK bouwen
        script: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew :app:assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
